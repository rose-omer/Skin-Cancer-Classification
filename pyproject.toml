[project]
name = "skinlesion"
version = "0.2.0"
description = "Dermoskopi görüntülerinde benign/malign sınıflandırma: tekrarlanabilir eğitim, kalibrasyon ve Gradio demosu (eğitim ve araştırma amaçlı)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.13",
    "torchvision>=0.28",
    "timm>=1.0.31",
    "numpy>=2.0",
    "pillow>=11.0",
    "scikit-learn>=1.9",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "safetensors>=0.6",
    "huggingface-hub>=1.0",
]

[project.optional-dependencies]
app = ["gradio>=6.32"]
onnx = ["onnx>=1.19", "onnxruntime>=1.32"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.6",
    "gradio>=6.32",
    "onnx>=1.19",
    "onnxruntime>=1.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skinlesion"]

# CPU torch: CI ve demo GPU istemez.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
